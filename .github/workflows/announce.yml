name: Announce an episode

# Posts the announcement of a published episode from the show's Bluesky account
# (packages/bot/README.md). Manual on purpose: an announcement goes out once, to real people, and
# only after a person has watched the deployed episode. Run it after the episode's pull request is
# merged and deploy.yml has finished, so the link card can be fetched.
#
# A dry run by default: it prints exactly what would be posted and sends nothing. Tick "live" to
# post. The bot itself refuses an unpublished or unbuilt episode, a post that would mention anyone,
# and a second announcement of the same episode.
#
# Needs: the repository secret BSKY_APP_PASSWORD (an app password, never the account password).
# The handle is configuration (bluesky.handle in show.config.json); the optional secret
# BSKY_HANDLE overrides it, for testing with another account. The site URL comes from
# show.config.json; the optional repository variable SITE_URL overrides it.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: The episode to announce (number or id, e.g. 2 or 002-some-slug)
        required: true
        type: string
      live:
        description: Post for real (unticked = dry run, nothing is sent)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: announce-${{ inputs.episode }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No npm install: the bot uses Node builtins only.
      - name: Announce (dry run unless live)
        env:
          EPISODE: ${{ inputs.episode }}
          LIVE: ${{ inputs.live }}
          APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          SITE: ${{ vars.SITE_URL }}
        run: |
          # export only what is set: an empty variable would override the committed configuration
          # The handle is configuration: the bot reads it from show.config.json.
          if [ -n "$SITE" ]; then export SITE_URL="$SITE"; fi
          if [ "$LIVE" = "true" ]; then
            if [ -z "$APP_PASSWORD" ]; then echo "error: the BSKY_APP_PASSWORD secret is not set"; exit 1; fi
            export BSKY_APP_PASSWORD="$APP_PASSWORD"
            npm run bot -- announce "$EPISODE" --live
          else
            npm run bot -- announce "$EPISODE"
          fi
